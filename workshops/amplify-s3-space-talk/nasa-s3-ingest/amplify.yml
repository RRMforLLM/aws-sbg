version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify no expone estas variables al runtime de Next.js por defecto.
        - env | grep -E '^(S3_BUCKET_NAME|S3_REGION|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
